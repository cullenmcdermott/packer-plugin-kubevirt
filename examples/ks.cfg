# Minimal Fedora 42 Kickstart for fast automated install
# Installation source
cdrom

# System configuration
text
lang en_US.UTF-8
keyboard us
timezone America/Denver --utc
selinux --permissive
rootpw --plaintext root
firewall --disabled

# Network - simple DHCP
network --bootproto=dhcp --activate

# Users
user --name=user --plaintext --password=root --groups=wheel
user --name=runner --plaintext --password=runner --groups=wheel

# Disk - simple flat partitioning (faster than LVM)
zerombr
clearpart --all --initlabel
autopart --type=plain

# Boot loader
bootloader --timeout=1

# Skip unnecessary steps
skipx
firstboot --disable

# Reboot into installed OS when done (required for Packer SSH provisioning)
reboot

# Minimal packages - just use @core defaults
%packages
@core
openssh-server
qemu-guest-agent
%end

# Post-install
%post --log=/root/ks-post.log
#!/bin/bash
echo "=== POST STARTED: $(date) ==="

# Enable SSH with password authentication
systemctl enable sshd
# Fedora 42 disables password auth by default - enable it for packer
sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
# Create drop-in to ensure it takes effect
mkdir -p /etc/ssh/sshd_config.d
echo 'PasswordAuthentication yes' > /etc/ssh/sshd_config.d/50-packer.conf
echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config.d/50-packer.conf

# Enable guest agent
systemctl enable qemu-guest-agent

# Passwordless sudo for wheel
echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel

echo "=== POST COMPLETE: $(date) ==="
%end
